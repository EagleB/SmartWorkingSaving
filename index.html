function Slider({ label, value, onChange, min, max, step, unit, hint }) {
  return (
    <div style={{ marginBottom: 22 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
        <span style={{ fontSize: 13, color: "#5a5652", fontWeight: 500 }}>{label}</span>
        <span style={{ fontSize: 15, color: "#1a1816", fontWeight: 600, fontVariantNumeric: "tabular-nums" }}>
          {value}{unit}
        </span>
      </div>
      <input
        type="range"
        min={min}
        max={max}
        step={step}
        value={value}
        onChange={(e) => onChange(parseFloat(e.target.value))}
        style={{ width: "100%", accentColor: "#b5482a", height: 4 }}
      />
      {hint && <div style={{ fontSize: 11.5, color: "#8a857f", marginTop: 4 }}>{hint}</div>}
    </div>
  );
}

function Simulatore() {
  const [lingua, setLingua] = useState("it");
  const testo = TESTI[lingua];
  const mesi = MESI[lingua];
  const [prezzoBenzina, setPrezzoBenzina] = useState(2.0);
  const [parametriAperti, setParametriAperti] = useState(true);
  const [giorniSettimana, setGiorniSettimana] = useState(1);
  const [settimaneAnno, setSettimaneAnno] = useState(46);
  const [potenzaPC, setPotenzaPC] = useState(90);
  const [oreAccesoUfficio, setOreAccesoUfficio] = useState(8);
  const [costoPastoCasa, setCostoPastoCasa] = useState(3);
  const [costoMensa, setCostoMensa] = useState(0.5);
  const [costoKwh, setCostoKwh] = useState(0.28);
  const [costoRiscaldamentoPieno, setCostoRiscaldamentoPieno] = useState(1.5);
  const [costoVentilatore, setCostoVentilatore] = useState(0.1);
  const [consumoAuto, setConsumoAuto] = useState(5.4);
  const [kmTratta, setKmTratta] = useState(8);
  const [costoAutostrada, setCostoAutostrada] = useState(0);
  const [tipoAuto, setTipoAuto] = useState("ice");
  const [costoKwhAuto, setCostoKwhAuto] = useState(0.25);
  const [consumoEV, setConsumoEV] = useState(16);
  const isEV = tipoAuto === "ev";

  useEffect(() => {
    document.documentElement.lang = lingua;
    document.title = testo.pageTitle;
    document.querySelector('meta[name="description"]').setAttribute("content", testo.pageDescription);
  }, [lingua, testo]);

  const calc = useMemo(() => {
    const kmGiorno = kmTratta * 2;
    const litriGiorno = (kmGiorno * consumoAuto) / 100;
    const kwhAutoGiorno = (kmGiorno * consumoEV) / 100;
    const benzinaGiorno = (isEV ? kwhAutoGiorno * costoKwhAuto : litriGiorno * prezzoBenzina) + costoAutostrada * 2;
    const kwhPC = (potenzaPC / 1000) * oreAccesoUfficio;
    const consumoPC = kwhPC * costoKwh;
    const co2Tragitto = isEV ? kwhAutoGiorno * CO2_RETE : litriGiorno * CO2_BENZINA;
    const co2Giorno = co2Tragitto - kwhPC * CO2_RETE;

    const giorniMese = (giorniSettimana * settimaneAnno) / 12;

    return mesi.map((mese, i) => {
      const stagione = STAGIONE[i];
      let elettricoExtra = consumoPC;
      if (stagione === 1) elettricoExtra += costoRiscaldamentoPieno;
      else if (stagione === 0.5) elettricoExtra += costoRiscaldamentoPieno * 0.4;
      else if (stagione === 2) elettricoExtra += costoVentilatore;

      const risparmioTrasportoMensa = benzinaGiorno + costoMensa - costoPastoCasa;
      const deltaGiorno = risparmioTrasportoMensa - elettricoExtra;

      return {
        mese,
        deltaGiorno,
        deltaMensile: deltaGiorno * giorniMese,
        elettricoExtra,
        benzinaGiorno,
        co2Giorno,
      };
    });
  }, [mesi, prezzoBenzina, giorniSettimana, settimaneAnno, potenzaPC, oreAccesoUfficio, costoPastoCasa, costoKwh, costoRiscaldamentoPieno, costoVentilatore, consumoAuto, kmTratta, costoAutostrada, costoMensa, isEV, costoKwhAuto, consumoEV]);

  const co2Giorno = calc[0].co2Giorno;
  const co2Annuo = (giorni) => co2Giorno * giorni * settimaneAnno;
  const co2Selezionato = co2Annuo(giorniSettimana);
  const alberi = Math.max(0, Math.round(co2Selezionato / CO2_ALBERO));
  const maxCo2 = Math.max(...GIORNI_CO2.map((g) => Math.abs(co2Annuo(g))), 1);
  const fmt = (s, vars) => Object.entries(vars).reduce((t, [k, v]) => t.replace(`{${k}}`, v), s);

  const totaleAnnuo = calc.reduce((s, m) => s + m.deltaMensile, 0);
  const maxAbs = Math.max(...calc.map((m) => Math.abs(m.deltaMensile)), 1);
  const sempreConviene = calc.every((m) => m.deltaGiorno > 0);
  const maiConviene = calc.every((m) => m.deltaGiorno < 0);

  const disegnaGrafico = (larghezza, altezza, disegna) => {
    const canvas = document.createElement("canvas");
    canvas.width = larghezza * 2;
    canvas.height = altezza * 2;
    const ctx = canvas.getContext("2d");
    ctx.scale(2, 2);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, larghezza, altezza);
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    disegna(ctx);
    return canvas.toDataURL("image/png");
  };

  const esportaExcel = async () => {
    if (!window.ExcelJS) { alert(testo.exportError); return; }
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet("Smart working");
    ws.columns = [{ width: 16 }, { width: 18 }, { width: 24 }, { width: 16 }, { width: 18 }];
    const intestazione = ws.addRow([testo.month, testo.fuelPerDay, testo.extraElectricityPerDay, testo.deltaPerDay, testo.monthDelta]);
    intestazione.font = { bold: true };
    const euro = '#,##0.00 "€";[Red]-#,##0.00 "€"';
    const arrotonda = (n) => Math.round(n * 100) / 100;
    calc.forEach((m) => {
      ws.addRow([m.mese, arrotonda(m.benzinaGiorno), arrotonda(m.elettricoExtra), arrotonda(m.deltaGiorno), arrotonda(m.deltaMensile)]);
    });
    const totale = ws.addRow([testo.exportTotal, null, null, null, arrotonda(totaleAnnuo)]);
    totale.font = { bold: true };
    for (let riga = 2; riga <= ws.rowCount; riga++) for (let col = 2; col <= 5; col++) ws.getCell(riga, col).numFmt = euro;

    const L = 760;
    const imgMensile = disegnaGrafico(L, 260, (ctx) => {
      ctx.fillStyle = "#1a1816"; ctx.textAlign = "left"; ctx.fillText(testo.monthlyDelta, 10, 18); ctx.textAlign = "center";
      const base = 130, meta = 90, larg = L / 12;
      ctx.strokeStyle = "#1a1816"; ctx.beginPath(); ctx.moveTo(0, base); ctx.lineTo(L, base); ctx.stroke();
      calc.forEach((m, i) => {
        const h = (Math.abs(m.deltaMensile) / maxAbs) * meta;
        ctx.fillStyle = m.deltaMensile >= 0 ? "#5c8a4a" : "#b5482a";
        ctx.fillRect(i * larg + 8, m.deltaMensile >= 0 ? base - h : base, larg - 16, h);
        ctx.fillStyle = "#5a5652";
        ctx.fillText(m.mese, i * larg + larg / 2, 245);
        ctx.fillText(m.deltaMensile.toFixed(0) + "€", i * larg + larg / 2, m.deltaMensile >= 0 ? base - h - 4 : base + h + 12);
      });
    });
    const imgCo2 = disegnaGrafico(L, 280, (ctx) => {
      ctx.fillStyle = "#1a1816"; ctx.textAlign = "left"; ctx.fillText(testo.co2Title, 10, 18);
      ctx.fillStyle = "#5a5652";
      ctx.fillText(fmt(testo.co2Summary, { days: giorniSettimana, kg: Math.round(co2Selezionato) }), 10, 38);
      ctx.font = "18px sans-serif";
      ctx.fillText("🌳".repeat(Math.min(alberi, MAX_ALBERI)) + (alberi > MAX_ALBERI ? " +" + (alberi - MAX_ALBERI) : ""), 10, 64);
      ctx.font = "12px sans-serif"; ctx.fillStyle = "#3d6b2c";
      ctx.fillText(alberi > 0 ? fmt(testo.co2Trees, { n: alberi }) : testo.co2NoTrees, 10, 84);
      ctx.textAlign = "center";
      const base = 235, meta = 110, larg = L / GIORNI_CO2.length;
      ctx.strokeStyle = "#1a1816"; ctx.beginPath(); ctx.moveTo(0, base); ctx.lineTo(L, base); ctx.stroke();
      GIORNI_CO2.forEach((g, i) => {
        const v = co2Annuo(g), sel = g === giorniSettimana;
        const h = v > 0 ? (v / maxCo2) * meta : 0;
        ctx.fillStyle = sel ? "#3d6b2c" : "#8fb280";
        ctx.fillRect(i * larg + 20, base - h, larg - 40, h);
        ctx.fillStyle = "#5a5652";
        ctx.fillText(String(g), i * larg + larg / 2, base + 15);
        ctx.fillText(Math.round(v) + " kg", i * larg + larg / 2, base - h - (sel ? 22 : 5));
        if (sel) { ctx.font = "16px sans-serif"; ctx.fillText("🌳", i * larg + larg / 2, base - h - 5); ctx.font = "12px sans-serif"; }
      });
      ctx.fillText(testo.co2Axis, L / 2, 268);
    });
    const riga = ws.rowCount + 2;
    ws.addImage(wb.addImage({ base64: imgMensile, extension: "png" }), { tl: { col: 0, row: riga }, ext: { width: L, height: 260 } });
    ws.addImage(wb.addImage({ base64: imgCo2, extension: "png" }), { tl: { col: 0, row: riga + 14 }, ext: { width: L, height: 280 } });

    const buffer = await wb.xlsx.writeBuffer();
    const url = URL.createObjectURL(new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = "smart-working-savings.xlsx";
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div style={{
      fontFamily: "'IBM Plex Mono', 'SF Mono', Menlo, monospace",
      background: "#f7f5f2",
      minHeight: "100vh",
      padding: "32px 20px",
      color: "#1a1816",
      boxSizing: "border-box",
    }}>
      <div style={{ maxWidth: 880, margin: "0 auto" }}>
        <div style={{ marginBottom: 32, position: "relative" }}>
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 4, marginBottom: 14 }}>
            {[{ code: "it", flag: "🇮🇹", label: "Italiano" }, { code: "en", flag: "🇬🇧", label: "English" }].map((linguaOpzione) => (
              <button
                key={linguaOpzione.code}
                type="button"
                aria-label={linguaOpzione.label}
                aria-pressed={lingua === linguaOpzione.code}
                onClick={() => setLingua(linguaOpzione.code)}
                style={{
                  border: `1px solid ${lingua === linguaOpzione.code ? "#b5482a" : "#ddd6cc"}`,
                  background: lingua === linguaOpzione.code ? "#fffaf5" : "transparent",
                  borderRadius: 3,
                  padding: "4px 7px",
                  fontSize: 18,
                  lineHeight: 1,
                  cursor: "pointer",
                  opacity: lingua === linguaOpzione.code ? 1 : 0.65,
                }}
              >
                {linguaOpzione.flag}
              </button>
            ))}
          </div>
          <div style={{ fontSize: 12, letterSpacing: 0.5, color: "#b5482a", fontWeight: 600, marginBottom: 6 }}>
            {testo.eyebrow}
          </div>
          <h1 style={{ fontSize: 26, fontWeight: 600, margin: 0, letterSpacing: -0.3, fontFamily: "Georgia, serif" }}>
            {testo.heading}
          </h1>
        </div>

        <div>
          <button
            type="button"
            aria-expanded={parametriAperti}
            onClick={() => setParametriAperti(!parametriAperti)}
            style={{
              width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center",
              border: "1px solid #ddd6cc", background: "#fffaf5", borderRadius: 3, padding: "8px 12px",
              marginBottom: 18, fontSize: 13, fontWeight: 600, fontFamily: "inherit", color: "#1a1816", cursor: "pointer",
            }}
          >
            <span>{testo.parameters}</span>
            <span style={{ fontWeight: 400, color: "#5a5652" }}>
              {parametriAperti ? testo.hideParameters : testo.showParameters} {parametriAperti ? "▾" : "▸"}
            </span>
          </button>
          {parametriAperti && <>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 18, flexWrap: "wrap" }}>
            <span style={{ fontSize: 13, color: "#5a5652", fontWeight: 500, marginRight: 6 }}>{testo.vehicleType}</span>
            {[{ code: "ice", label: "⛽ " + testo.vehicleIce }, { code: "ev", label: "⚡ " + testo.vehicleEv }].map((opt) => (
              <button
                key={opt.code}
                type="button"
                aria-pressed={tipoAuto === opt.code}
                onClick={() => setTipoAuto(opt.code)}
                style={{
                  border: `1px solid ${tipoAuto === opt.code ? "#b5482a" : "#ddd6cc"}`,
                  background: tipoAuto === opt.code ? "#fffaf5" : "transparent",
                  borderRadius: 3,
                  padding: "6px 10px",
                  fontSize: 13,
                  fontFamily: "inherit",
                  color: "#1a1816",
                  cursor: "pointer",
                  opacity: tipoAuto === opt.code ? 1 : 0.65,
                }}
              >
                {opt.label}
              </button>
            ))}
          </div>
          <div style={{
            display: "grid",
            gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))",
            columnGap: 28,
            marginBottom: 8,
          }}>
            {!isEV && <Slider label={testo.fuelPrice} value={prezzoBenzina} onChange={setPrezzoBenzina} min={1.3} max={2.5} step={0.01} unit=" €/L" />}
            {isEV && <Slider label={testo.evChargeCost} value={costoKwhAuto} onChange={setCostoKwhAuto} min={0.05} max={0.8} step={0.01} unit=" €/kWh" hint={testo.evChargeHint} />}
            <Slider label={testo.commuteDistance} value={kmTratta} onChange={setKmTratta} min={1} max={100} step={1} unit=" km" hint={testo.oneWay} />
            {!isEV && <Slider label={testo.carConsumption} value={consumoAuto} onChange={setConsumoAuto} min={3} max={15} step={0.1} unit=" L/100km" />}
            {isEV && <Slider label={testo.evConsumption} value={consumoEV} onChange={setConsumoEV} min={10} max={30} step={0.5} unit=" kWh/100km" />}
            <Slider label={testo.tollCost} value={costoAutostrada} onChange={setCostoAutostrada} min={0} max={20} step={0.5} unit=" €" hint={testo.oneWay} />
            <Slider label={testo.remoteDays} value={giorniSettimana} onChange={setGiorniSettimana} min={0} max={5} step={1} unit={lingua === "it" ? " gg" : " days"} />
            <Slider label={testo.workingWeeks} value={settimaneAnno} onChange={setSettimaneAnno} min={30} max={52} step={1} unit={lingua === "it" ? " sett." : " weeks"} hint={testo.workingWeeksHint} />
            <Slider label={testo.canteenCost} value={costoMensa} onChange={setCostoMensa} min={0} max={10} step={0.5} unit=" €" />
            <Slider label={testo.homeMealCost} value={costoPastoCasa} onChange={setCostoPastoCasa} min={0} max={10} step={0.5} unit=" €" hint={testo.homeMealHint} />
            <Slider label={testo.computerPower} value={potenzaPC} onChange={setPotenzaPC} min={30} max={400} step={10} unit=" W" />
            <Slider label={testo.poweredHours} value={oreAccesoUfficio} onChange={setOreAccesoUfficio} min={1} max={12} step={0.5} unit=" h" />
            <Slider label={testo.electricityCost} value={costoKwh} onChange={setCostoKwh} min={0.15} max={0.5} step={0.01} unit=" €/kWh" />
            <Slider label={testo.heatingExtra} value={costoRiscaldamentoPieno} onChange={setCostoRiscaldamentoPieno} min={0} max={4} step={0.1} unit=" €/gg" hint={testo.heatingHint} />
            <Slider label={testo.fanExtra} value={costoVentilatore} onChange={setCostoVentilatore} min={0} max={1} step={0.05} unit=" €/gg" />
          </div>
          </>}

          <div style={{ marginTop: 12 }}>
            <div style={{
              background: sempreConviene ? "#eef5ea" : maiConviene ? "#f5eae8" : "#f2efe9",
              border: `1px solid ${sempreConviene ? "#a8c99a" : maiConviene ? "#d9a898" : "#ddd6cc"}`,
              borderRadius: 3,
              padding: "18px 20px",
              marginBottom: 24,
            }}>
              <div style={{ fontSize: 11, color: "#5a5652", marginBottom: 4 }}>{testo.annualSaving}</div>
              <div style={{ fontSize: 32, fontWeight: 700, fontFamily: "Georgia, serif", color: totaleAnnuo >= 0 ? "#3d6b2c" : "#a8412a" }}>
                {totaleAnnuo >= 0 ? "+" : ""}{totaleAnnuo.toFixed(2)} €
                <span style={{ fontSize: 14, fontWeight: 400, color: "#5a5652" }}>
                  {" "}({totaleAnnuo >= 0 ? testo.remoteSaves : testo.officeSaves})
                </span>
              </div>
              <div style={{ fontSize: 12.5, color: "#5a5652", marginTop: 6 }}>
                {sempreConviene && testo.remoteAlways}
                {maiConviene && testo.officeAlways}
                {!sempreConviene && !maiConviene && testo.mixedMonths}
              </div>
            </div>

            <div style={{ marginBottom: 8, fontSize: 11, color: "#5a5652" }}>
              {testo.monthlyDelta}
            </div>
            <div style={{ display: "flex", gap: 6, height: 90, alignItems: "flex-end" }}>
              {calc.map((m) => {
                const h = m.deltaMensile >= 0 ? (Math.abs(m.deltaMensile) / maxAbs) * 100 : 0;
                return (
                  <div key={m.mese} style={{ flex: 1, height: "100%", display: "flex", alignItems: "flex-end" }}>
                    <div title={`${m.mese}: ${m.deltaMensile.toFixed(2)}€`} style={{ width: "100%", height: `${h}%`, background: "#5c8a4a", borderRadius: "1px 1px 0 0" }} />
                  </div>
                );
              })}
            </div>
            <div style={{ display: "flex", gap: 6, borderTop: "1px solid #1a1816" }}>
              {calc.map((m) => (
                <div key={m.mese} style={{ flex: 1, height: 4, borderLeft: "1px solid transparent" }} />
              ))}
            </div>
            <div style={{ display: "flex", gap: 6, height: 90, alignItems: "flex-start", marginBottom: 6 }}>
              {calc.map((m) => {
                const h = m.deltaMensile < 0 ? (Math.abs(m.deltaMensile) / maxAbs) * 100 : 0;
                return (
                  <div key={m.mese} style={{ flex: 1, height: "100%", display: "flex", alignItems: "flex-start" }}>
                    <div title={`${m.mese}: ${m.deltaMensile.toFixed(2)}€`} style={{ width: "100%", height: `${h}%`, background: "#b5482a", borderRadius: "0 0 1px 1px" }} />
                  </div>
                );
              })}
            </div>
            <div style={{ display: "flex", gap: 6, marginBottom: 28 }}>
              {calc.map((m) => (
                <div key={m.mese} style={{ flex: 1, textAlign: "center", fontSize: 10.5, color: "#8a857f" }}>
                  {m.mese}
                </div>
              ))}
            </div>

            <div style={{ background: "#eef5ea", border: "1px solid #a8c99a", borderRadius: 3, padding: "16px 20px", marginBottom: 28 }}>
              <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 8 }}>{testo.co2Title}</div>
              <div style={{ fontSize: 12.5, color: "#5a5652" }}>
                {fmt(testo.co2Summary, { days: giorniSettimana, kg: Math.round(co2Selezionato) })}
              </div>
              <div style={{ fontSize: 20, lineHeight: 1.3, margin: "6px 0 2px" }} aria-hidden="true">
                {"🌳".repeat(Math.min(alberi, MAX_ALBERI))}{alberi > MAX_ALBERI && <span style={{ fontSize: 13 }}> +{alberi - MAX_ALBERI}</span>}
              </div>
              <div style={{ fontSize: 12.5, fontWeight: 600, color: "#3d6b2c", marginBottom: 14 }}>
                {alberi > 0 ? fmt(testo.co2Trees, { n: alberi }) : testo.co2NoTrees}
              </div>
              <div style={{ display: "flex", gap: 8, height: 90, alignItems: "flex-end" }}>
                {GIORNI_CO2.map((g) => {
                  const v = co2Annuo(g);
                  const sel = g === giorniSettimana;
                  return (
                    <div key={g} onClick={() => setGiorniSettimana(g)} title={fmt(testo.co2Tooltip, { days: g, kg: Math.round(v) })} style={{ cursor: "pointer", flex: 1, height: "100%", display: "flex", flexDirection: "column", justifyContent: "flex-end", alignItems: "center" }}>
                      {sel && <span style={{ fontSize: 14, lineHeight: 1 }} aria-hidden="true">🌳</span>}
                      <div style={{ width: "100%", height: `${v > 0 ? (v / maxCo2) * 85 : 0}%`, background: sel ? "#3d6b2c" : "#5c8a4a", opacity: sel ? 1 : 0.6, borderRadius: "1px 1px 0 0" }} />
                    </div>
                  );
                })}
              </div>
              <div style={{ display: "flex", gap: 8, borderTop: "1px solid #1a1816" }}>
                {GIORNI_CO2.map((g) => (
                  <div key={g} onClick={() => setGiorniSettimana(g)} style={{ cursor: "pointer", flex: 1, textAlign: "center", fontSize: 11, color: g === giorniSettimana ? "#1a1816" : "#8a857f", fontWeight: g === giorniSettimana ? 700 : 400 }}>{g}</div>
                ))}
              </div>
              <div style={{ fontSize: 10.5, color: "#8a857f", textAlign: "center", marginTop: 4 }}>{testo.co2Axis}</div>
            </div>

            <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 10 }}>
              <button
                type="button"
                onClick={esportaExcel}
                style={{ border: "1px solid #b5482a", background: "#fffaf5", borderRadius: 3, padding: "6px 12px", fontSize: 13, fontFamily: "inherit", color: "#1a1816", cursor: "pointer" }}
              >
                📊 {testo.exportExcel}
              </button>
            </div>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
              <thead>
                <tr style={{ borderBottom: "1px solid #1a1816" }}>
                  <th style={{ textAlign: "left", padding: "6px 4px", fontWeight: 600 }}>{testo.month}</th>
                  <th style={{ textAlign: "right", padding: "6px 4px", fontWeight: 600 }}>{testo.fuelPerDay}</th>
                  <th style={{ textAlign: "right", padding: "6px 4px", fontWeight: 600 }}>{testo.extraElectricityPerDay}</th>
                  <th style={{ textAlign: "right", padding: "6px 4px", fontWeight: 600 }}>{testo.deltaPerDay}</th>
                  <th style={{ textAlign: "right", padding: "6px 4px", fontWeight: 600 }}>{testo.monthDelta}</th>
                </tr>
              </thead>
              <tbody>
                {calc.map((m) => (
                  <tr key={m.mese} style={{ borderBottom: "1px solid #e8e3da" }}>
                    <td style={{ padding: "6px 4px" }}>{m.mese}</td>
                    <td style={{ textAlign: "right", padding: "6px 4px", color: "#5a5652" }}>{m.benzinaGiorno.toFixed(2)}€</td>
                    <td style={{ textAlign: "right", padding: "6px 4px", color: "#5a5652" }}>{m.elettricoExtra.toFixed(2)}€</td>
                    <td style={{ textAlign: "right", padding: "6px 4px", fontWeight: 600, color: m.deltaGiorno >= 0 ? "#3d6b2c" : "#a8412a" }}>
                      {m.deltaGiorno >= 0 ? "+" : ""}{m.deltaGiorno.toFixed(2)}€
                    </td>
                    <td style={{ textAlign: "right", padding: "6px 4px", fontWeight: 600, color: m.deltaMensile >= 0 ? "#3d6b2c" : "#a8412a" }}>
                      {m.deltaMensile >= 0 ? "+" : ""}{m.deltaMensile.toFixed(2)}€
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        <div style={{ marginTop: 32, fontSize: 11.5, color: "#5a5652", borderTop: "1px solid #ddd6cc", paddingTop: 18, lineHeight: 1.7 }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: "#1a1816", marginBottom: 10 }}>{testo.formulaTitle}</div>

          <div style={{ marginBottom: 12 }}>
            <strong style={{ color: "#1a1816" }}>{testo.fuelFormulaTitle}</strong>{testo.fuelFormula}<br/>
            {testo.fuelAssumption}
          </div>

          <div style={{ marginBottom: 12 }}>
            <strong style={{ color: "#1a1816" }}>{testo.electricityFormulaTitle}</strong>{testo.electricityFormula}<br/>
            {testo.seasonalExtra}<br/>
            {testo.electricityAssumption}
          </div>

          <div style={{ marginBottom: 12 }}>
            <strong style={{ color: "#1a1816" }}>{testo.co2FormulaTitle}</strong>{testo.co2Formula}<br/>
            {testo.co2Assumption}
          </div>

          <div style={{ marginBottom: 12 }}>
            <strong style={{ color: "#1a1816" }}>{testo.dailyDeltaTitle}</strong>{testo.dailyDeltaFormula}<br/>
            {testo.dailyDeltaMeaning}
          </div>

          <div style={{ marginBottom: 12 }}>
            <strong style={{ color: "#1a1816" }}>{testo.monthlyDeltaTitle}</strong>{testo.monthlyDeltaFormula}<br/>
            <strong style={{ color: "#1a1816" }}>{testo.annualSavingTitle}</strong>{testo.annualSavingFormula}
          </div>

          <div>
            {testo.otherAssumptions}
          </div>

          <div style={{ marginTop: 22, paddingTop: 14, borderTop: "1px solid #ddd6cc" }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: "#1a1816", marginBottom: 4 }}>{testo.credits}</div>
            <div>{testo.createdBy}</div>
            <a href="https://github.com/EagleB" target="_blank" rel="noreferrer" style={{ color: "#b5482a" }}>
              {testo.githubProfile}: github.com/EagleB
            </a>
            <br />
            <a href="https://www.linkedin.com/in/simonebelfiore" target="_blank" rel="noreferrer" style={{ color: "#b5482a" }}>
              {testo.linkedinProfile}: linkedin.com/in/simonebelfiore
            </a>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Simulatore />);
</script>
</body>
</html>
